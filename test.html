        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;

        }
        .journal-entry {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .journal-entry h2 {
            margin-top: 0;
        }
        .image-wrapper {
            margin-bottom: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 4px solid red; /* Bright red border */
        }
        .caption {
            font-size: 1.5em;
            color: blue;
        }
    </style>
</head>
<body>

    function createEntryHTML(entry) {
        let html = `
        <div class="journal-entry">
            <h2>${entry.date} - ${entry.stock} (${entry.action})</h2>
            <p>Reason: ${entry.reason}</p>`;

        for (let i = 1; i <= 10; i++) {
            if (entry[`imageURL${i}`]) {
                html += `
                <div class="image-wrapper">
                    <img src="${entry[`imageURL${i}`]}" alt="Image ${i}">
                    <p class="caption">${entry[`caption${i}`]}</p>
                </div>`;
            }
        }

        html += `</div>`;
        return html;
    }

    const journalContainer = document.getElementById('journal-entries');
    entries.forEach(entry => {
        journalContainer.innerHTML += createEntryHTML(entry);
    });
</script>
